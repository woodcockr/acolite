# Builds the acolite-mp dev container image and mounts AWS credentials plus a
# configurable host directory (ACOLITE_DATA_DIR, see .env.example) for workflow outputs.
services:
  acolite-mp-dev:
    build: docker
    user: vscode
    volumes:
      - ~/.aws:/home/vscode/.aws
      - ${ACOLITE_DATA_DIR:-../acolite-mp-data}:/data
    restart: no