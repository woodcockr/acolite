[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Ensures the workspace acolite package takes priority over any acolite install
# already on PYTHONPATH/sys.path (e.g. /opt/acolite baked into the base image).
pythonpath = .
markers =
    network: requires network access; opt-in via ACOLITE_TEST_NETWORK=1
